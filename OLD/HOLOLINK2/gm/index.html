<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel MG</title>
  <style>
    :root { --tlo: #f5f6f7; --karta: #fff; --tekst: #1c2226; --slaby: #66737b; --linia: #d9dee2; --akcent: #0b7a6a; --zly: #c0392b; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --tlo: #111517; --karta: #1a2023; --tekst: #e3e8ea; --slaby: #8d9aa1; --linia: #2c3438; --akcent: #4de2c9; --zly: #ff6b5e; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--tlo); color: var(--tekst); }
    header { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--linia); background: var(--karta); }
    header h1 { font-size: 17px; margin: 0; }
    nav { display: flex; gap: 4px; flex-wrap: wrap; }
    nav button, .btn { border: 1px solid var(--linia); background: var(--karta); color: var(--tekst); border-radius: 6px; padding: 8px 12px; cursor: pointer; font: inherit; }
    nav button.on { border-color: var(--akcent); color: var(--akcent); }
    .btn.glowny { background: var(--akcent); border-color: var(--akcent); color: #fff; }
    .btn.zly { color: var(--zly); }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .karta { background: var(--karta); border: 1px solid var(--linia); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    label { display: grid; gap: 4px; font-size: 13px; color: var(--slaby); }
    input, select, textarea { font: inherit; color: var(--tekst); background: var(--tlo); border: 1px solid var(--linia); border-radius: 6px; padding: 8px; width: 100%; }
    textarea { min-height: 140px; font-family: ui-monospace, monospace; font-size: 13px; }
    .siatka { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--linia); vertical-align: top; }
    th { font-size: 12px; color: var(--slaby); font-weight: 600; }
    .rzad { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .msg { padding: 10px; border-radius: 6px; margin-bottom: 12px; }
    .msg.blad { background: rgba(192, 57, 43, .12); color: var(--zly); }
    .msg.ok { background: rgba(11, 122, 106, .12); color: var(--akcent); }
    .slaby { color: var(--slaby); font-size: 13px; }
    .przewijana { overflow-x: auto; }
  </style>
</head>
<body>
  <header>
    <h1>Panel MG</h1>
    <nav id="menu" hidden></nav>
    <span class="slaby" id="kto"></span>
  </header>
  <main id="glowna"></main>
  <script type="module" src="mg.js"></script>
</body>
</html>
